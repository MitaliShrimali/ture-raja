name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        tools: composer:v2

    - name: Install Composer Dependencies
      run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install NPM Dependencies and Build
      run: |
        npm install
        npm run build

    - name: Setup SSH
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.SERVER_SSH_KEY }}
        known_hosts: unnecessary

    - name: Add Known Hosts
      run: ssh-keyscan -p ${{ secrets.SERVER_PORT }} -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

    - name: Sync Core App Files
      run: rsync -avz --exclude='.git' --exclude='public' --exclude='node_modules' -e "ssh -p ${{ secrets.SERVER_PORT }}" ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/u362391755/domains/vardaansmartsolutions.com/tour-raja/

    - name: Sync Public Files
      run: rsync -avz -e "ssh -p ${{ secrets.SERVER_PORT }}" ./public/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/u362391755/domains/vardaansmartsolutions.com/public_html/tour-raja/

    - name: Run Post-Deployment Commands
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        script: |
          cd /home/u362391755/domains/vardaansmartsolutions.com/tour-raja
          echo "🗄 Running migrations"
          php artisan migrate --force
          
          echo "🧹 Clearing caches"
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear
          
          echo "⚡ Rebuilding caches"
          php artisan config:cache
          # Route caching often breaks subdirectory hosting, leaving it out
          # php artisan route:cache
          php artisan view:cache
          
          echo "🔗 Storage link"
          php artisan storage:link || true
